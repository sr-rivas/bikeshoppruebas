<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="login css y js/login.css">
</head>
<body>

<div class="neon-bg">
  <div class="login-wrapper">
    <div class="animated-border">
      <div class="login-card">

        <!-- LOGIN -->
        <form id="loginForm" class="form active">
          <h3 class="text-center mb-4">
            <i class="bi bi-person-circle"></i> Iniciar Sesión
          </h3>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="text" id="loginUser" class="form-control" placeholder="Correo o usuario">
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPass" class="form-control" placeholder="Contraseña">
          </div>

          <div class="d-flex justify-content-between mb-3 small">
            <div>
              <input type="checkbox" id="rememberMe"> Recordarme
            </div>
            <span class="link" onclick="showForgot()">¿Olvidó su contraseña?</span>
          </div>

          <button class="btn btn-neon w-100 mb-3">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar
          </button>

          <p class="text-center small">
            ¿No tienes cuenta?
            <span class="link" onclick="showRegister()">Registrarse</span>
          </p>
        </form>

        <!-- RECUPERAR -->
        <form id="forgotForm" class="form">
          <h3 class="text-center mb-4">
            <i class="bi bi-key"></i> Recuperar Contraseña
          </h3>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
            <input type="email" id="forgotEmail" class="form-control" placeholder="Correo electrónico">
          </div>

          <button class="btn btn-neon w-100 mb-3">
            <i class="bi bi-send"></i> Enviar clave
          </button>

          <p class="text-center small">
            <span class="link" onclick="showLogin()">Volver</span>
          </p>
        </form>

        <!-- REGISTRO -->
        <form id="registerForm" class="form">
          <h3 class="text-center mb-4">
            <i class="bi bi-person-plus"></i> Registrarse
          </h3>

          <input class="form-control mb-2" id="name" placeholder="Nombre">
          <input class="form-control mb-2" id="lastname" placeholder="Apellido">
          <input class="form-control mb-2" id="email" placeholder="Correo">
          <input class="form-control mb-3" id="password" type="password" placeholder="Contraseña (mín. 6)">

          <button class="btn btn-neon w-100 mb-3">
            <i class="bi bi-check-circle"></i> Crear cuenta
          </button>

          <p class="text-center small">
            <span class="link" onclick="showLogin()">Ya tengo cuenta</span>
          </p>
        </form>

      </div>
    </div>
  </div>
</div>

<script src="login css y js/login.js"></script>
</body>
</html>
